rootkit","name":"ROOTKIT","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u = gl_FragCoord.xy/R;\n  float t = T*(0.30 + S.y*0.40);\n\n  vec2 p = u, id = vec2(0.0);\n  float edge = 0.0, infect = 0.0;\n  for (int i=0;i<4;i++){\n    float fi = float(i);\n    vec2 g = floor(p*2.0), f = fract(p*2.0);\n    id = id*4.0 + g.x + g.y*2.0 + 1.0;\n    float b = min(min(f.x, 1.0-f.x), min(f.y, 1.0-f.y));\n    edge   = max(edge,   smoothstep(0.035/(fi+1.0), 0.0, b)*(1.0 - fi*0.18));\n    infect = max(infect, step(hash21(id + S.z*30.0)*8.0, mod(t, 9.0))*(1.0 - fi*0.12));\n    p = f;\n  }\n\n  vec3 ok  = hsv(0.55 + S.x*0.10, 0.35, 0.80);\n  vec3 bad = vec3(1.00,0.18,0.16);\n  vec3 col = vec3(0.010,0.012,0.016) + edge*mix(ok, bad, infect)*0.95;\n\n  float lane = floor(u.y*40.0);\n  float fire = step(0.985, hash21(vec2(lane, floor(t*8.0))));\n  col += fire*smoothstep(0.5, 0.0, abs(fract(u.y*40.0) - 0.5))\n       * step(u.x, fract(hash11(lane) + t*0.6))*bad*0.75;\n  col += infect*bad*0.03;\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"rubik","name":"RUBIK","author":"claude-opus-5","depth":0,"src":"float sticker(vec2 p, vec2 o, vec2 ax, vec2 ay, out vec2 uvOut){\n  vec2 q=p-o;\n  float det=ax.x*ay.y-ax.y*ay.x;\n  uvOut=vec2(q.x*ay.y-q.y*ay.x, q.y*ax.x-q.x*ax.y)/det;\n  return step(0.0,uvOut.x)*step(uvOut.x,1.0)*step(0.0,uvOut.y)*step(uvOut.y,1.0);\n}\nvoid main(){\n  vec2 u=uvc(); float t=T*(0.30+S.y*0.30);\n  vec3 col=vec3(0.014,0.014,0.020);\n  float turn=floor(t*0.5), ph=fract(t*0.5);\n  float wob=sin(ph*3.14159265)*0.10;\n  vec2 ex=rot(wob*0.5)*vec2(0.26,0.15), ey=rot(wob*0.5)*vec2(-0.26,0.15), ez=vec2(0.0,-0.32);\n  for(int fce=0;fce<3;fce++){\n    float ff=float(fce);\n    vec2 A = fce==0?ex : (fce==1?ey : ex);\n    vec2 B = fce==0?ey : (fce==1?ez : ez);\n    vec2 org = fce==0?vec2(0.0,0.10) : (fce==1?vec2(-0.26,-0.05) : vec2(0.0,-0.05));\n    vec2 st;\n    float inFace=sticker(u, org-A*0.5-B*0.0, A, B, st);\n    if(inFace<0.5) continue;\n    vec2 g=floor(st*3.0), f=fract(st*3.0);\n    float pad=smoothstep(0.06,0.14,min(min(f.x,1.0-f.x),min(f.y,1.0-f.y)));\n    float h=hash21(g+ff*7.0+floor(turn*0.999)*3.0);\n    vec3 c=hsv(floor(h*6.0)/6.0*0.92+S.x*0.05,0.85,1.0);\n    float shade=0.55+0.45*(1.0-ff*0.30);\n    col=mix(vec3(0.020,0.020,0.026), c*shade, pad);\n  }\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"runner","name":"RUNNER","author":"claude-opus-5","depth":0,"src":"float sdSeg(vec2 p, vec2 a, vec2 b, float r){\n  vec2 pa = p - a, ba = b - a;\n  float h = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0);\n  return length(pa - ba*h) - r;\n}\n\nvoid main(){\n  vec2 u = uvc();\n  float t = T*(0.7 + S.y*0.5);\n  float gy = -0.30;\n\n  vec3 col = mix(hsv(0.06 + S.x*0.05, 0.55, 0.50),\n                 hsv(0.62 + S.x*0.10, 0.45, 0.10), smoothstep(-0.3, 0.5, u.y));\n  col += hsv(0.09, 0.50, 1.0)*smoothstep(0.10, 0.085, length(u - vec2(0.24,0.24)))*0.9;\n\n  // the world scrolls the wrong way. he is being carried backwards.\n  for (int i=0;i<3;i++){\n    float fi = float(i);\n    float x = u.x - t*(0.06 + fi*0.10);\n    float hg = -0.10 - fi*0.06 + (fbm(vec2(x*(1.2+fi), fi*7.0)) - 0.5)*(0.22 - fi*0.05);\n    col = mix(col, hsv(0.62 + S.x*0.10, 0.35, 0.10 - fi*0.025), step(u.y, hg));\n  }\n  col = mix(col, vec3(0.020,0.020,0.028), step(u.y, gy));\n  col = mix(col, vec3(0.050,0.050,0.070),\n            step(u.y,gy)*step(gy-0.05,u.y)*step(0.5, fract(u.x*7.0 + t*0.55)));\n\n  // obstacles, which pass straight through him\n  for (int i=0;i<4;i++){\n    float fi = float(i);\n    float ox = fract(t*0.16 + fi*0.25 + hash11(fi)*0.3)*1.6 - 0.8;\n    float ow = 0.030 + hash11(fi + 3.0)*0.020;\n    float oh = 0.060 + hash11(fi + 7.0)*0.070;\n    col = mix(col, vec3(0.10,0.09,0.12),\n              step(abs(u.x - ox), ow)*step(gy, u.y)*step(u.y, gy + oh)*0.85);\n  }\n\n  // he never jumps\n  vec2 hip = vec2(-0.22, gy + 0.16), sh = vec2(-0.22, gy + 0.28);\n  float ph = t*3.4, d = 1000.0;\n  for (int i=0;i<2;i++){\n    float f = float(i)*3.14159265;\n    float a = sin(ph + f)*0.85;\n    float b = a - 0.55 - 0.55*max(sin(ph + f + 1.2), 0.0);\n    vec2 kn = hip + vec2(sin(a), -cos(a))*0.085;\n    vec2 ft = kn  + vec2(sin(b), -cos(b))*0.085;\n    d = min(d, sdSeg(u, hip, kn, 0.016));\n    d = min(d, sdSeg(u, kn, ft, 0.013));\n    float aa = -sin(ph + f)*0.90;\n    vec2 el = sh + vec2(sin(aa), -cos(aa))*0.075;\n    vec2 hd = el + vec2(sin(aa + 0.9), -cos(aa + 0.9))*0.070;\n    d = min(d, sdSeg(u, sh, el, 0.013));\n    d = min(d, sdSeg(u, el, hd, 0.011));\n  }\n  d = min(d, sdSeg(u, hip, sh, 0.030));\n  d = min(d, length(u - sh - vec2(0.0,0.045)) - 0.036);\n  col = mix(col, vec3(0.018,0.018,0.026), smoothstep(0.004, 0.0, d));\n\n  // the score, counting down\n  float ticks = floor(mod(200.0 - t*3.0, 60.0));\n  col += step(0.40, u.y)*step(u.y, 0.42)*step(fract((u.x+0.5)*60.0), 0.5)\n       * step((u.x + 0.5)*60.0, ticks)*hsv(0.13, 0.60, 1.0)*0.55;\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"rust","name":"RUST","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*1.7; float t=T*(0.04+S.y*0.07);\n  float ox=smoothstep(0.40,0.68, fbm(u*1.5+t*0.06)+fbm(u*5.0)*0.28);\n  float pit=smoothstep(0.62,0.80, fbm(u*11.0));\n  vec3 steel=vec3(0.30,0.32,0.35)*(0.75+0.40*noise(u*40.0));\n  steel*=0.92+0.14*step(0.5,fract(u.y*22.0));\n  vec3 rust=hsv(0.045+S.x*0.03+noise(u*16.0)*0.03,0.78,0.20+0.55*noise(u*24.0));\n  vec3 col=mix(steel, rust, ox);\n  col=mix(col, rust*0.45, pit*ox);\n  col+=smoothstep(0.05,0.0,abs(ox-0.5))*vec3(0.30,0.14,0.05)*0.55;\n  col*=0.88+0.22*noise(u*90.0);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"sandstorm","name":"SANDSTORM","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.60+S.y*0.55);\n  vec3 col=mix(hsv(0.09+S.x*0.03,0.55,0.62), hsv(0.08,0.42,0.34), smoothstep(0.5,-0.5,u.y));\n  float dune=-0.18+fbm(vec2(u.x*1.6+t*0.05,0.0))*0.20;\n  col=mix(col, hsv(0.08,0.50,0.26)*(0.8+0.35*noise(u*12.0)), step(u.y,dune));\n  for(int i=0;i<4;i++){\n    float fi=float(i);\n    float sp=0.6+fi*0.45;\n    vec2 q=u*vec2(1.0,2.2)+vec2(t*sp, sin(t*0.5+fi)*0.2);\n    float streak=fbm(q*vec2(1.4,7.0)+fi*11.0);\n    col=mix(col, hsv(0.085,0.35,0.85), smoothstep(0.55,0.85,streak)*(0.30-fi*0.05));\n  }\n  col*=0.80+0.35*fbm(u*3.0+vec2(t*0.9,0.0));\n  col+=hsv(0.10,0.30,1.0)*smoothstep(0.30,0.0,length(u-vec2(0.25,0.30)))*0.30;\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"scales","name":"SCALES","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.10+S.y*0.16);\n  vec2 p=u*vec2(9.0,11.0);\n  p+=vec2(sin(u.y*4.0+t)*0.5, t*0.3);\n  p.x+=step(0.5,fract(p.y*0.5))*0.5;\n  vec2 g=floor(p), f=fract(p)-0.5;\n  float d=length(f*vec2(1.0,1.25));\n  float irid=fract(S.x+hash21(g)*0.15+d*0.7+sin(g.x*0.4+g.y*0.3+t)*0.10);\n  vec3 col=vec3(0.020,0.025,0.030);\n  col=mix(col, hsv(irid,0.70,0.22+0.78*clamp(1.0-d*1.5,0.0,1.0)), smoothstep(0.48,0.36,d));\n  col+=smoothstep(0.50,0.42,d)*smoothstep(0.34,0.44,d)*hsv(irid+0.10,0.40,1.0)*0.45;\n  col*=0.60+0.50*smoothstep(1.0,0.0,length(u));\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"serpent","name":"SERPENT","author":"claude-opus-5","depth":0,"src":"vec2 spath(float s, float t, float coil){\n  float a = s*6.2831853*coil + t*0.35;\n  float r = 0.10 + s*0.30;\n  return vec2(cos(a), sin(a)*0.72)*r + vec2(0.0, sin(t*0.4)*0.02);\n}\nvoid main(){\n  vec2 u = uvc();\n  float t = T*(0.25 + S.y*0.35);\n  float coil = 1.2 + floor(S.z*3.0)*0.5;\n\n  float bd = 1000.0, bs = 0.0;\n  for (int i=0;i<44;i++){\n    float s = float(i)/43.0;\n    float d = length(u - spath(s, t, coil));\n    if (d < bd){ bd = d; bs = s; }\n  }\n\n  float rad  = 0.055*(1.0 - 0.62*bs) + 0.012;\n  float body = smoothstep(rad, rad - 0.008, bd);\n  float lat  = clamp(bd/rad, 0.0, 1.0);\n  float shade = sqrt(max(1.0 - lat*lat, 0.0));\n  float sc = abs(fract(bs*70.0 + (lat*2.0 - 1.0)*1.6) - 0.5);\n  float hue = fract(S.x + bs*0.55 + lat*0.12 + t*0.02);\n\n  vec3 col = vec3(0.006,0.007,0.012);\n  col = mix(col, hsv(hue, 0.72, 1.0)*(0.18 + 0.85*shade)\n                *(0.55 + 0.65*smoothstep(0.22, 0.42, sc)), body);\n  col += body*smoothstep(0.25, 0.0, lat)*hsv(hue + 0.10, 0.30, 1.0)*0.5;\n\n  vec2 hp = spath(0.0, t, coil);\n  float k = length((u - hp)*vec2(1.0,1.25))/0.075;\n  float head = smoothstep(1.0, 0.83, k);\n  col = mix(col, hsv(S.x, 0.55, 0.78)*(0.30 + 0.90*sqrt(max(1.0 - k*k, 0.0))), head);\n  col += smoothstep(0.012, 0.0, length(u - hp - vec2(0.022,0.018)))*hsv(0.12,0.90,1.0)*2.2*head;\n\n  col = col/(1.0 + col*0.30);\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"shoal","name":"SHOAL","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.30+S.y*0.35);\n  vec3 col=mix(vec3(0.020,0.075,0.110), vec3(0.004,0.020,0.045), smoothstep(-0.6,0.6,u.y));\n  col+=vec3(0.10,0.16,0.14)*smoothstep(0.35,0.75,fbm(u*3.0+vec2(t*0.15,0.0)))*0.35;\n  vec2 q=u+vec2(fbm(u*1.2+vec2(t*0.22,0.0)), fbm(u*1.2+vec2(7.3,2.1)-vec2(0.0,t*0.18)))*0.40-0.20;\n  q=rot(sin(t*0.4)*0.35)*q;\n  float sc=34.0+S.z*24.0;\n  vec2 g=floor(q*sc), f=fract(q*sc)-0.5;\n  vec2 j=(hash22(g)-0.5)*0.7;\n  vec2 d=f-j;\n  float fish=smoothstep(0.42,0.10,length(d*vec2(0.55,1.6)));\n  float dens=smoothstep(0.34,0.70,fbm(q*1.9+vec2(t*0.12,-t*0.09)));\n  float here=step(1.0-dens*0.92, hash21(g+17.3));\n  float flash=step(0.86,fract(hash21(g)*7.0+t*0.9));\n  col=mix(col, vec3(0.35,0.42,0.48)*(0.5+1.4*flash), fish*here);\n  col+=fish*here*flash*vec3(0.55,0.70,0.80)*0.6;\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"sigil","name":"SIGIL","author":"claude-opus-5","depth":0,"src":"float ring(float r, float rad, float w){ return smoothstep(w, 0.0, abs(r-rad)); }\n\nvoid main(){\n  vec2 u = uvc();\n  float t = T*(0.10 + S.y*0.12);\n  float r = length(u), a = atan(u.y, u.x);\n  float n = 5.0 + floor(S.z*4.0)*2.0;\n  float seg = 6.2831853/n;\n\n  float ink = ring(r,0.42,0.0038) + ring(r,0.40,0.0018) + ring(r,0.17,0.0028);\n\n  float aa = mod(a + t, seg) - seg*0.5;\n  ink += smoothstep(0.0038,0.0, abs(cos(aa)*r - 0.40*cos(seg*0.5)));\n  float ab = mod(a - t*1.6 + seg*0.5, seg) - seg*0.5;\n  ink += smoothstep(0.0032,0.0, abs(cos(ab)*r - 0.33*cos(seg*0.5)))*0.8;\n\n  vec2 P = vec2(cos(abs(aa)), sin(abs(aa)))*r;\n  vec2 V = vec2(cos(seg*0.5), sin(seg*0.5))*0.40;\n  ink += smoothstep(0.017,0.009, length(P - V));\n\n  float band = smoothstep(0.435,0.445,r)*smoothstep(0.485,0.475,r);\n  ink += band*smoothstep(0.985,1.0, abs(sin(a*n*3.0 - t*2.0)));\n\n  vec3 gold = hsv(0.11 + S.x*0.06, 0.72, 1.0);\n  vec3 col = vec3(0.010,0.008,0.012);\n  col += ink*gold*(0.75 + 0.25*sin(T*0.7));\n  col += gold*0.055*exp(-abs(r-0.40)*7.0);\n  col *= 0.90 + 0.20*noise(u*R.y*0.04);\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"singularity","name":"SINGULARITY","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u = uvc();\n  float t = T*(0.20 + S.y*0.30);\n  float r = max(length(u), 0.0012);\n\n  // One radius governs everything. The lens map qr = r + sh*sh/r has its minimum\n  // exactly at r = sh, where qr = 2*sh. So the rim of the shadow, the photon ring\n  // and the inner edge of the disk are the same circle by construction — they\n  // cannot drift apart the way three separately chosen radii did.\n  float sh = 0.088;\n  float rs = 2.0*sh;\n  vec2  q  = u*(1.0 + (sh*sh)/(r*r));\n  float qr = length(q);\n  float qa = atan(q.y, q.x);\n\n  float inc = 0.26, Rout = 0.46;\n  vec2  dp = vec2(q.x, q.y/inc);\n  float dr = length(dp), da = atan(dp.y, dp.x);\n\n  // direct image: the disk through the equatorial plane, fading in off the ring\n  float turb = fbm(vec2(da*2.2 - t*1.4, dr*7.0));\n  float disk = smoothstep(Rout, Rout - 0.13, dr)*smoothstep(rs, rs*1.10, dr);\n  vec3  col  = hsv(0.09 + S.x*0.05 - turb*0.05, 0.62, 1.0)\n             * disk*(0.30 + 1.5*turb)*max(0.08, 0.45 + 0.55*sin(da))*1.5;\n\n  // far side lensed over the hole: a halo seated on the ring, thickest at top\n  // and bottom, which is where the direct image has nothing to show\n  float wing = smoothstep(rs*(1.18 + 0.90*abs(sin(qa))), rs, qr);\n  wing *= 0.45 + 0.95*fbm(vec2(qa*2.6 + t*1.1, qr*16.0));\n  col += hsv(0.10 + S.x*0.04, 0.52, 1.0)*wing*max(0.10, 0.45 + 0.55*sin(qa))*1.15;\n\n  vec2 sg = floor(q*70.0);\n  if (hash21(sg) > 0.985)\n    col += vec3(0.80,0.85,1.00)*smoothstep(0.35, 0.0, length(fract(q*70.0) - 0.5))*0.85;\n\n  col *= smoothstep(sh*0.94, sh*1.02, r);                 // the shadow\n  col += smoothstep(0.009, 0.0, abs(r - sh))*hsv(0.11, 0.28, 1.0)*1.9;\n\n  gl_FragColor = vec4(max(col, 0.0), 1.0);\n}"},{"id":"slime","name":"SLIME","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*1.4; float t=T*(0.10+S.y*0.16);\n  vec2 q=u; float trail=0.0;\n  for(int i=0;i<6;i++){\n    float n=fbm(q*(2.2+S.z*1.5)+vec2(t*0.09,-t*0.07));\n    q+=vec2(cos(n*6.2831853),sin(n*6.2831853))*0.055;\n    trail+=exp(-abs(n-0.5)*14.0);\n  }\n  trail/=6.0;\n  float net=smoothstep(0.18,0.62,trail);\n  float node=smoothstep(0.55,0.95,trail);\n  vec3 col=vec3(0.020,0.018,0.014);\n  col=mix(col, hsv(0.12+S.x*0.06,0.70,0.85), net);\n  col+=node*hsv(0.09,0.55,1.0)*0.85;\n  col*=0.75+0.45*noise(u*30.0);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"sparks","name":"SPARKS","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc();\n  vec3 col=vec3(0.0);\n  for(int i=0;i<26;i++){\n    float fi=float(i);\n    float sd=hash11(fi+S.x*97.0+1.0);\n    float sp=0.18+sd*0.55;\n    vec2 p=vec2(hash11(fi*1.7+3.0)-0.5,hash11(fi*2.3+7.0)-0.5)*1.7;\n    p.y=mod(p.y+0.85-T*sp*0.38,1.7)-0.85;\n    p.x+=sin(T*sp+fi)*0.07;\n    float d=length(u-p);\n    col+=hsv(S.x+sd*0.38,0.55,1.0)*(0.0055/(d+0.0035))*(0.35+0.65*sd);\n  }\n  col=col/(1.0+col);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"spectrogram","name":"SPECTROGRAM","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 uv = gl_FragCoord.xy/R;\n  float t  = T*(0.50 + S.y*0.60);\n  float tt = t - (1.0 - uv.x)*4.0;        // x is time, scrolling right to left\n  float fq = exp(uv.y*4.2)*0.020;         // y is log frequency\n\n  float e = 0.0;\n\n  float f0 = 0.075 + 0.045*sin(tt*0.45 + S.x*6.2831) + 0.012*sin(tt*1.7);\n  for (int h=1;h<=9;h++){\n    float fh = f0*float(h);\n    float z  = (fq - fh)/(fh*0.045);\n    e += exp(-z*z)/pow(float(h), 1.35);\n  }\n\n  for (int i=0;i<2;i++){\n    float fi = float(i);\n    float fc = 0.20 + fi*0.34 + 0.12*sin(tt*(0.31 + fi*0.23) + fi*2.0 + S.z*6.2831);\n    float z  = (fq - fc)/(fc*0.22);\n    e += 0.55*exp(-z*z);\n  }\n\n  float trans = step(0.985, hash11(floor(tt*9.0)))*exp(-fract(tt*9.0)*7.0);\n  e += 0.10*noise(vec2(tt*7.0, fq*140.0));\n  e += trans*0.55*(0.30 + 0.70*noise(vec2(fq*90.0, floor(tt*9.0))));\n\n  float k = pow(clamp(e,0.0,1.6)/1.6, 0.62);\n  vec3 col = vec3(0.020,0.020,0.050);\n  col = mix(col, hsv(0.66 + S.x*0.05, 0.85, 0.55), smoothstep(0.00,0.35,k));\n  col = mix(col, hsv(0.02, 0.90, 0.95),            smoothstep(0.30,0.72,k));\n  col = mix(col, vec3(1.00,0.96,0.88),             smoothstep(0.72,1.00,k));\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"stained","name":"STAINED","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.06+S.y*0.10);\n  float r=length(u), a=atan(u.y,u.x);\n  float n=8.0+floor(S.z*5.0)*2.0;\n  float seg=6.2831853/n;\n  float aa=abs(mod(a+t*0.05,seg)-seg*0.5);\n  vec2 cell=vec2(floor(r*7.0), floor((a+t*0.05)/seg));\n  float h=hash21(cell);\n  float lead=smoothstep(0.020,0.038, abs(fract(r*7.0)-0.5)*0.28)\n            *smoothstep(0.016,0.036, aa);\n  vec3 glass=hsv(fract(S.x+h*0.85),0.85,0.30+0.70*hash21(cell+3.0));\n  glass*=0.55+0.75*smoothstep(0.9,0.0,r);\n  float light=0.55+0.60*sin(t*0.5+r*4.0);\n  vec3 col=mix(vec3(0.020,0.018,0.016), glass*light, lead);\n  col+=glass*lead*pow(clamp(1.0-r*1.1,0.0,1.0),2.0)*0.55;\n  col+=smoothstep(0.10,0.0,r)*hsv(0.12,0.5,1.0)*0.8;\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"stairwell","name":"STAIRWELL","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.10+S.y*0.16);\n  float r=max(length(u),0.0015), a=atan(u.y,u.x);\n  float k=a/6.2831853*8.0+(log(r)*1.6+t*0.35)*8.0;\n  float tread=fract(k), lvl=floor(k);\n  vec3 col=vec3(0.055,0.055,0.065);\n  col=mix(col, vec3(0.62,0.60,0.58)*(0.22+0.60*fract(lvl*0.37)),\n          smoothstep(0.0,0.06,tread)*smoothstep(1.0,0.94,tread));\n  col+=smoothstep(0.04,0.0,abs(tread-0.5))*0.05;\n  col*=smoothstep(0.02,0.35,r)*(0.55+0.45*smoothstep(0.95,0.10,r));\n  col=mix(col, hsv(0.10+S.x*0.05,0.25,1.0)*0.35, smoothstep(0.55,0.95,r)*0.4);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"statues","name":"STATUES","author":"claude-opus-5","depth":0,"src":"float sdSeg(vec2 p, vec2 a, vec2 b, float r){\n  vec2 pa = p - a, ba = b - a;\n  float h = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0);\n  return length(pa - ba*h) - r;\n}\n\nvec2 lane(float s){\n  return vec2(-0.58 + s*1.16, sin(s*5.0 + 0.6)*0.20 + sin(s*11.0)*0.045);\n}\n\nvoid main(){\n  vec2 u = uvc();\n  float t = T*(0.35 + S.y*0.35);\n\n  float g = noise(u*9.0)*0.6 + noise(u*30.0)*0.3;\n  vec3 col = mix(hsv(0.31 + S.x*0.06, 0.44, 0.13), hsv(0.24, 0.34, 0.24), g);\n\n  float pd = 1000.0;\n  for (int i=0;i<30;i++){\n    float s = float(i)/29.0;\n    pd = min(pd, length(u - lane(s)));\n  }\n  col = mix(col, hsv(0.09, 0.34, 0.20 + 0.12*noise(u*40.0)), smoothstep(0.062, 0.042, pd));\n  col += hsv(0.45, 0.6, 1.0)*smoothstep(0.006, 0.0, abs(length(u - lane(0.0)) - 0.05))*0.5;\n  col += hsv(0.02, 0.7, 1.0)*smoothstep(0.006, 0.0, abs(length(u - lane(1.0)) - 0.05))*0.5;\n\n  float bodyD = 1000.0, hpAt = 1.0;\n  vec2 tgt = lane(0.9);\n  float bestx = 9.0, haveTarget = 0.0;\n\n  for (int i=0;i<6;i++){\n    float fi  = float(i);\n    float per = 7.0 + hash11(fi*3.1)*4.0;\n    float lp  = fract((t + fi*1.37)/per);\n    float die = 0.50 + hash11(fi + 9.0)*0.34;\n    vec2  pos = lane(min(lp, die));\n\n    if (lp < die){\n      float hp = 1.0 - lp/die;\n      vec2 fwd = normalize(lane(min(lp + 0.02, 1.0)) - pos + vec2(0.0002,0.0001));\n      vec2 q = vec2(dot(u - pos, vec2(-fwd.y, fwd.x)), dot(u - pos, fwd));\n      float bob = sin(t*6.0 + fi)*0.004;\n\n      col *= 1.0 - 0.45*smoothstep(0.004,-0.020,\n             length((u - pos - vec2(0.016,-0.016))*vec2(1.0,0.85)) - 0.034);\n\n      float dd = length(q*vec2(1.0,0.72)) - 0.032;\n      dd = min(dd, length(q - vec2(0.0, 0.013 + bob)) - 0.019);\n      dd = min(dd, sdSeg(q, vec2(-0.028,0.0), vec2(-0.042,-0.020 + bob*3.0), 0.008));\n      dd = min(dd, sdSeg(q, vec2( 0.028,0.0), vec2( 0.042,-0.020 - bob*3.0), 0.008));\n      if (dd < bodyD){ bodyD = dd; hpAt = hp; }\n\n      vec2 hb = u - pos - vec2(0.0, 0.056);\n      float bar = step(abs(hb.x), 0.034)*step(abs(hb.y), 0.005);\n      col = mix(col, vec3(0.04,0.04,0.05), bar);\n      col = mix(col, mix(vec3(0.92,0.16,0.10), vec3(0.25,0.95,0.32), hp),\n                bar*step(hb.x, -0.034 + 0.068*hp));\n\n      if (pos.x < bestx){ bestx = pos.x; tgt = pos; haveTarget = 1.0; }\n    } else {\n      float k = (lp - die)*per;                     // seconds since it burst\n      vec2 dp = u - pos;\n      float rr = length(dp);\n      float sp = fract(atan(dp.y, dp.x)*11.0/6.2831853 + hash11(fi));\n      col += vec3(0.92,0.90,0.86)*smoothstep(0.26, 0.0, abs(sp - 0.5)*2.0)\n           * smoothstep(0.055, 0.0, abs(rr - k*0.42))*exp(-k*4.5)*1.6;\n      col += vec3(1.00,0.86,0.62)*exp(-rr*24.0)*exp(-k*13.0)*1.5;\n    }\n  }\n\n  float veins = noise(u*26.0)*0.5 + noise(u*80.0)*0.25;\n  vec3 marble = vec3(0.87,0.87,0.83)*(0.60 + 0.40*veins);\n  marble = mix(marble, vec3(0.35,0.35,0.40), smoothstep(0.50, 0.85, veins)*0.35);\n  marble = mix(marble, vec3(0.17,0.15,0.15),\n               smoothstep(0.55, 0.85, noise(u*60.0))*(1.0 - hpAt));\n  col = mix(col, marble, smoothstep(0.003,-0.003, bodyD));\n  col += smoothstep(0.009, 0.0, abs(bodyD))*0.28;\n\n  for (int i=0;i<3;i++){\n    float fi = float(i);\n    vec2 tp = vec2(-0.34 + fi*0.34, 0.27*(1.0 - 2.0*mod(fi, 2.0)));\n    float bd = length(u - tp) - 0.045;\n    col = mix(col, vec3(0.15,0.17,0.21), smoothstep(0.004,-0.004, bd));\n    col += smoothstep(0.007, 0.0, abs(bd))*hsv(0.55, 0.50, 1.0)*0.45;\n\n    vec2 ba = tgt - tp;\n    float L = max(length(ba), 0.0001);\n    vec2 dir = ba/L, perp = vec2(-dir.y, dir.x);\n    col = mix(col, vec3(0.29,0.31,0.37),\n              smoothstep(0.003,-0.003, sdSeg(u, tp, tp + dir*0.058, 0.012)));\n\n    vec2 pa = u - tp;\n    float hh = clamp(dot(pa,ba)/dot(ba,ba), 0.0, 1.0);\n    float axial = length(pa - ba*hh);\n\n    if (fi < 0.5){                                   // autocannon\n      float b = 0.0;\n      for (int k2=0;k2<3;k2++)\n        b += exp(-length(u - tp - ba*fract(t*2.2 + float(k2)*0.333))*280.0);\n      col += b*hsv(0.14, 0.80, 1.0)*1.8*haveTarget;\n    } else if (fi < 1.5){                            // laser\n      float fl = 0.55 + 0.45*hash11(floor(t*22.0));\n      col += smoothstep(0.005, 0.0, axial)*step(0.10, hh)*step(hh, 0.97)\n           * hsv(0.98 + S.x*0.04, 0.80, 1.0)*2.0*fl*haveTarget;\n      col += exp(-axial*80.0)*hsv(0.02, 0.60, 1.0)*0.55*haveTarget;\n    } else {                                         // missile with a smoke trail\n      float mp = fract(t*0.7);\n      col += exp(-length(u - tp - ba*mp - perp*sin(mp*3.14159265)*0.10)*200.0)\n           * vec3(1.00,0.75,0.35)*2.2*haveTarget;\n      for (int k3=1;k3<5;k3++){\n        float f3 = mp - float(k3)*0.055;\n        col += step(0.0, f3)\n             * exp(-length(u - tp - ba*max(f3,0.0) - perp*sin(max(f3,0.0)*3.14159265)*0.10)*95.0)\n             * vec3(0.45,0.45,0.50)*0.32*(1.0 - float(k3)*0.2)*haveTarget;\n      }\n    }\n  }\n\n  col *= smoothstep(1.30, 0.45, length(u*vec2(1.0,1.1)))*0.55 + 0.55;\n  gl_FragColor = vec4(max(col,0.0), 1.0);\n}"},{"id":"strands","name":"STRANDS","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u = uvc();\n  float t = T*(0.18 + S.y*0.26);\n  vec3 col = vec3(0.006,0.006,0.012);\n  for (int i=0;i<4;i++){\n    float fi = float(i);\n    float R0  = 0.16 + fi*0.072;\n    float inc = 0.22 + hash11(fi*2.7 + S.z*10.0)*0.60;\n    vec2 p = rot(t*(0.35 - fi*0.06) + fi*1.4)*u;\n    vec2 e = vec2(p.x, p.y/inc);\n    float rr = length(e), a = atan(e.y, e.x);\n    float bs = fract(a*(18.0 + fi*7.0)/6.2831853 + t*0.4);\n    float glint = pow(smoothstep(0.34, 0.10, abs(bs - 0.5)*2.0), 3.0);\n    float strand = smoothstep(0.013, 0.0, abs(rr - R0));\n    col += strand*(0.22 + glint*1.7)\n         * hsv(fract(S.x + a*0.16 + rr*0.7 + t*0.05), 0.55, 1.0)\n         * (0.45 + 0.55*sin(a*3.0 + t));\n  }\n  col = col/(1.0 + col*0.5);\n  gl_FragColor = vec4(col,1.0);\n}"},{"id":"strata","name":"STRATA","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*1.8;\n  u=rot(S.z*3.14159)*u;\n  float band=u.y*5.0+fbm(u*1.4+vec2(T*0.12,0.0))*4.0;\n  float k=fract(band);\n  float e=smoothstep(0.0,0.06,k)*smoothstep(1.0,0.94,k);\n  float idx=floor(band);\n  float tint=hash11(idx*1.37+S.x*50.0);\n  vec3 col=hsv(S.x+tint*0.3,0.55,0.08+0.9*e*(0.4+0.6*tint));\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"surveil","name":"SURVEIL","author":"claude-opus-5","depth":0,"src":"float box(vec2 p, vec2 c, vec2 h){ vec2 d = abs(p-c) - h; return step(max(d.x,d.y), 0.0); }\nfloat segMask(float d){\n  d = floor(mod(d, 10.0));\n  if (d < 0.5) return  63.0;\n  if (d < 1.5) return   6.0;\n  if (d < 2.5) return  91.0;\n  if (d < 3.5) return  79.0;\n  if (d < 4.5) return 102.0;\n  if (d < 5.5) return 109.0;\n  if (d < 6.5) return 125.0;\n  if (d < 7.5) return   7.0;\n  if (d < 8.5) return 127.0;\n  return 111.0;\n}\nfloat bitAt(float m, float i){ return mod(floor(m/pow(2.0, i)), 2.0); }\nfloat seven(vec2 p, float d){\n  float m = segMask(d), v = 0.0;\n  v += bitAt(m,0.0)*box(p, vec2(0.50,0.92), vec2(0.28,0.045));\n  v += bitAt(m,1.0)*box(p, vec2(0.86,0.71), vec2(0.045,0.16));\n  v += bitAt(m,2.0)*box(p, vec2(0.86,0.29), vec2(0.045,0.16));\n  v += bitAt(m,3.0)*box(p, vec2(0.50,0.08), vec2(0.28,0.045));\n  v += bitAt(m,4.0)*box(p, vec2(0.14,0.29), vec2(0.045,0.16));\n  v += bitAt(m,5.0)*box(p, vec2(0.14,0.71), vec2(0.045,0.16));\n  v += bitAt(m,6.0)*box(p, vec2(0.50,0.50), vec2(0.28,0.045));\n  return clamp(v, 0.0, 1.0)*box(p, vec2(0.5,0.5), vec2(0.5,0.5));\n}\n\nvoid main(){\n  vec2 u = uvc();\n  float t = T*(0.5 + S.y*0.4);\n\n  // the camera is on a slow, aimless PTZ patrol\n  vec2 p = (u + vec2(sin(t*0.07 + S.x*6.0)*0.10, sin(t*0.05 + 2.0)*0.03))\n         * (1.0 + 0.08*sin(t*0.037 + 1.0));\n\n  float hz = 0.12;\n  vec3 col;\n  if (p.y > hz){\n    col = vec3(0.030,0.032,0.038)*(0.6 + 0.5*noise(p*6.0));\n    col = mix(col, vec3(0.55,0.50,0.34), box(p, vec2(0.22,0.20), vec2(0.045,0.075))*0.85);\n  } else {\n    float z = 0.09/(hz - p.y + 0.010);\n    vec2 gp = vec2(p.x*z*2.0, z);\n    col = vec3(0.055,0.056,0.062)*(0.55 + 0.55*noise(gp*3.0));\n    col = mix(col, vec3(0.42,0.40,0.30),\n              step(0.94, fract(gp.x*0.8))*step(fract(gp.y*0.35), 0.55)*0.70);\n    col += vec3(0.35,0.33,0.22)*exp(-abs(p.x - 0.10)*7.0)*exp(-abs(z - 2.2)*0.7)*0.65;\n    col += vec3(0.30,0.30,0.22)*exp(-abs(p.x + 0.28)*8.0)*exp(-abs(z - 4.5)*0.5)*0.45;\n\n    for (int i=0;i<4;i++){\n      float fi = float(i);\n      float sc = 1.0/(1.4 + fi*1.3);\n      float bx = (hash11(fi*3.3 + S.z*11.0) - 0.5)*1.1;\n      float w = 0.32*sc, h = 0.18*sc;\n      float by = hz - h*1.3;\n      col = mix(col, vec3(0.085,0.088,0.098)*(0.7 + 0.5*hash11(fi)),\n                box(p, vec2(bx, by + h*0.5), vec2(w,h)));\n      col += vec3(0.50,0.15,0.12)*box(p, vec2(bx + w*0.72, by + h*0.45),\n                                      vec2(0.012*sc, 0.008*sc))*0.9;\n    }\n\n    // something walks through, now and then\n    float ep = floor(t*0.08), ph = fract(t*0.08);\n    vec2 fp = p - vec2(-0.55 + ph*1.10, hz - 0.10);\n    float fig = clamp(box(fp, vec2(0.0,0.055), vec2(0.016,0.055))\n                    + step(length(fp - vec2(0.0,0.125)), 0.020), 0.0, 1.0);\n    col = mix(col, vec3(0.020,0.020,0.026), fig*step(hash11(ep + S.x*13.0), 0.55));\n  }\n\n  // the pipeline it comes down: interlace, sensor grain, macroblocks, low bitrate\n  col *= 0.88 + 0.12*step(0.5, fract(gl_FragCoord.y*0.5));\n  col += (hash21(u*R + floor(T*24.0)) - 0.5)*0.075;\n  col += (hash21(floor(gl_FragCoord.xy/8.0) + floor(T*6.0)) - 0.5)*0.035;\n  col = floor(col*7.0 + 0.5)/7.0;\n  col = mix(col, vec3(hash21(vec2(floor(gl_FragCoord.y/6.0), floor(T*30.0)))),\n            step(0.986, hash11(floor(T*3.0)))*0.65);\n  col *= smoothstep(1.25, 0.35, length(u*vec2(1.0,1.1)));\n\n  // overlay\n  vec3 ui = vec3(0.86,0.90,0.86);\n  col += vec3(1.0,0.25,0.20)*step(length(u - vec2(-0.40,0.40)), 0.011)*step(0.5, fract(T*0.8));\n  col += ui*box(u, vec2(0.0, 0.455), vec2(0.010,0.0014))*0.5;\n  col += ui*box(u, vec2(0.0,-0.455), vec2(0.010,0.0014))*0.5;\n\n  float tot = mod(floor(T) + floor(S.z*40000.0), 86400.0);\n  float hh = floor(tot/3600.0), mm = floor(mod(tot,3600.0)/60.0), ss = mod(tot,60.0);\n  vec2 tp = (u - vec2(-0.42,-0.44))/vec2(0.024,0.038);\n  float glyph = 0.0;\n  for (int i=0;i<6;i++){\n    float fi = float(i);\n    float dg;\n    if      (fi < 0.5) dg = floor(hh/10.0);\n    else if (fi < 1.5) dg = mod(hh, 10.0);\n    else if (fi < 2.5) dg = floor(mm/10.0);\n    else if (fi < 3.5) dg = mod(mm, 10.0);\n    else if (fi < 4.5) dg = floor(ss/10.0);\n    else               dg = mod(ss, 10.0);\n    glyph += seven(tp - vec2(fi*1.30 + floor(fi/2.0)*0.50, 0.0), dg);\n  }\n  glyph += box(tp, vec2(2.28,0.30), vec2(0.05,0.05)) + box(tp, vec2(2.28,0.66), vec2(0.05,0.05));\n  glyph += box(tp, vec2(5.10,0.30), vec2(0.05,0.05)) + box(tp, vec2(5.10,0.66), vec2(0.05,0.05));\n  col += ui*clamp(glyph, 0.0, 1.0)*0.85;\n\n  gl_FragColor = vec4(max(col, 0.0), 1.0);\n}"},{"id":"tarot","name":"TAROT","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.15+S.y*0.20);\n  float spin=t*0.6;\n  float c=cos(spin);\n  vec2 p=vec2(u.x/max(abs(c),0.06), u.y);\n  float inCard=step(abs(p.x),0.26)*step(abs(p.y),0.42);\n  vec3 col=vec3(0.020,0.016,0.026)+hsv(0.72,0.5,1.0)*exp(-length(u)*2.2)*0.06;\n  float face=step(0.0,c);\n  float r=length(p*vec2(1.5,1.0)), a=atan(p.y,p.x);\n  float n=6.0+floor(S.z*5.0);\n  float seg=6.2831853/n;\n  float aa=abs(mod(a+t*0.2,seg)-seg*0.5);\n  float star=smoothstep(0.010,0.0,abs(cos(aa)*r-0.24))\n            +smoothstep(0.008,0.0,abs(r-0.30))\n            +smoothstep(0.006,0.0,abs(r-0.12));\n  float back=smoothstep(0.010,0.0,abs(fract(p.x*9.0)-0.5)*0.11)\n            +smoothstep(0.010,0.0,abs(fract(p.y*14.0)-0.5)*0.07);\n  vec3 gold=hsv(0.12+S.x*0.05,0.70,1.0);\n  vec3 card=mix(vec3(0.055,0.035,0.070), vec3(0.10,0.07,0.045), face);\n  card+=gold*mix(back*0.5, star, face)*0.9;\n  card+=gold*smoothstep(0.012,0.0,max(abs(p.x)-0.235,abs(p.y)-0.395))*0.45;\n  col=mix(col, card*(0.55+0.55*abs(c)), inCard);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"tesseract","name":"TESSERACT","author":"claude-opus-5","depth":0,"src":"vec2 proj(vec4 v, float t){\n  float c1=cos(t*0.55), s1=sin(t*0.55);\n  float x=v.x*c1-v.w*s1, w=v.x*s1+v.w*c1;\n  float c2=cos(t*0.37), s2=sin(t*0.37);\n  float y=v.y*c2-v.z*s2, z=v.y*s2+v.z*c2;\n  float k4=1.9/(2.6-w);\n  vec3 q=vec3(x,y,z)*k4;\n  float c3=cos(t*0.29), s3=sin(t*0.29);\n  float qx=q.x*c3-q.z*s3, qz=q.x*s3+q.z*c3;\n  float k3=1.6/(3.0-qz);\n  return vec2(qx,q.y)*k3;\n}\nvoid main(){\n  vec2 u=uvc(); float t=T*(0.30+S.y*0.35);\n  float d=1000.0;\n  for(int i=0;i<16;i++){\n    float fi=float(i);\n    vec4 a=vec4(mod(floor(fi),2.0), mod(floor(fi/2.0),2.0),\n                mod(floor(fi/4.0),2.0), mod(floor(fi/8.0),2.0))*2.0-1.0;\n    for(int b=0;b<4;b++){\n      vec4 e=vec4(float(b==0),float(b==1),float(b==2),float(b==3));\n      if(dot(a,e)>0.0) continue;\n      vec4 bb=a+e*2.0;\n      vec2 p0=proj(a,t), p1=proj(bb,t);\n      vec2 pa=u-p0, ba=p1-p0;\n      float hh=clamp(dot(pa,ba)/max(dot(ba,ba),1e-5),0.0,1.0);\n      d=min(d, length(pa-ba*hh));\n    }\n  }\n  vec3 tint=hsv(fract(S.x+0.55),0.60,1.0);\n  vec3 col=vec3(0.008,0.010,0.020);\n  col+=tint*smoothstep(0.0075,0.0,d)*1.1;\n  col+=tint*exp(-d*36.0)*0.45;\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"tide","name":"TIDE","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.30+S.y*0.30);\n  float hz=0.16;\n  vec3 col=mix(hsv(0.58+S.x*0.05,0.35,0.80), hsv(0.55,0.15,0.95), smoothstep(0.6,hz,u.y));\n  if(u.y<hz){\n    float z=0.11/(hz-u.y+0.013);\n    vec2 gp=vec2(u.x*z*1.8, z);\n    float reach=0.55+0.45*sin(t*0.35);\n    float shore=2.6-reach*1.5;\n    float wet=smoothstep(shore+0.5,shore-0.2,z);\n    vec3 sand=hsv(0.10,0.28,0.72)*(0.80+0.30*noise(gp*7.0));\n    sand=mix(sand, sand*0.62, wet*0.75);\n    float wave=0.0;\n    for(int i=0;i<3;i++){\n      float fi=float(i);\n      float ph=z*1.5-t*(1.1+fi*0.3)+sin(gp.x*0.8+fi)*0.5+fi*2.0;\n      wave=max(wave, smoothstep(0.75,1.0,sin(ph))*smoothstep(shore+2.2,shore-0.1,z));\n    }\n    vec3 water=hsv(0.50+S.x*0.06,0.45,0.55)*(0.6+0.5*noise(gp*4.0));\n    col=mix(sand, water, smoothstep(shore+0.1,shore+1.4,z));\n    col=mix(col, vec3(0.96,0.98,1.0), wave*0.85);\n    col*=0.45+0.65*smoothstep(7.0,0.6,z);\n  }\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"tower","name":"TOWER","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u = uvc();\n  float t = T*(0.15 + S.y*0.22);\n  vec2 p = u + vec2(t*0.020, 0.0);\n\n  float sky = smoothstep(-0.50, 0.55, u.y);\n  vec3 col = mix(vec3(0.038,0.032,0.058), vec3(0.009,0.011,0.026), sky);\n  col += fbm(p*2.2 + vec2(t*0.05, 0.0))*vec3(0.050,0.045,0.078)*(0.4 + sky);\n\n  float md = length(u - vec2(0.28, 0.26));\n  col += vec3(0.55,0.55,0.62)*smoothstep(0.075, 0.065, md);\n  col += vec3(0.15,0.16,0.24)*exp(-md*7.0)*0.55;\n\n  float mask = 0.0, win = 0.0;\n  for (int i=0;i<5;i++){\n    float fi = float(i);\n    float cx = (hash11(fi*3.7 + S.x*30.0) - 0.5)*1.30;\n    float w  = 0.045 + hash11(fi*2.3 + 1.0)*0.050;\n    float hg = -0.10 + hash11(fi*5.1 + 2.0)*0.55;\n    float rh =  0.09 + hash11(fi*7.7 + 3.0)*0.075;\n    float dx = abs(p.x - cx);\n\n    float body = step(dx, w)*step(p.y, hg);\n    float roof = step(dx, w*1.25*(1.0 - clamp((p.y-hg)/rh, 0.0, 1.0)))\n               * step(hg, p.y)*step(p.y, hg + rh);\n    mask = max(mask, max(body, roof));\n\n    vec2 wc = vec2((p.x - cx)/(w*0.9), (p.y + 0.55)/0.075);\n    float lit = step(0.60, hash21(floor(wc) + fi*17.0));\n    float fl  = 0.70 + 0.30*sin(T*(1.0 + hash21(floor(wc)*1.3)*3.0) + fi);\n    win = max(win, body*lit*fl*smoothstep(0.36, 0.16, length(fract(wc) - 0.5)));\n  }\n\n  col = mix(col, vec3(0.007,0.007,0.013), mask);\n  col += win*hsv(0.62 + S.z*0.26, 0.75, 1.0)*1.5;\n  col = mix(col, vec3(0.020,0.020,0.036), smoothstep(-0.35,-0.56,u.y));\n\n  vec2 blk = floor(gl_FragCoord.xy/8.0);\n  float q = 3.0 + floor(S.z*4.0);\n  col = floor(col*q + 0.5)/q;\n  col += (hash21(blk + floor(T*6.0)) - 0.5)*0.055;\n  float lum = dot(col, vec3(0.299,0.587,0.114));\n  col = mix(col, vec3(lum)*hsv(0.60 + hash21(blk*0.5 + 3.0)*0.12, 0.55, 1.35), 0.28);\n  float drag = step(0.972, hash21(vec2(floor(gl_FragCoord.y/8.0), floor(T*2.0))));\n  col = mix(col, col.gbr, drag*0.65);\n  gl_FragColor = vec4(max(col, 0.0), 1.0);\n}"},{"id":"truchet","name":"TRUCHET","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*(2.4+S.z*2.8);\n  u=rot(T*0.06)*u;\n  vec2 g=floor(u), f=fract(u)-0.5;\n  float h=hash21(g);\n  if(h<0.5) f.x=-f.x;\n  float d=abs(abs(f.x+f.y)-0.5);\n  float w=0.07+0.045*sin(T*1.4+g.x*0.8+g.y*0.6);\n  float m=smoothstep(w,w*0.35,d);\n  vec3 col=mix(hsv(S.x+0.5,0.45,0.04),hsv(S.x+h*0.22,0.75,1.0),m);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"tunnel","name":"TUNNEL","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc(); float t=T*(0.30+S.y*0.35);\n  float r=max(length(u),0.0015), a=atan(u.y,u.x);\n  float z=1.0/r+t*1.1;\n  float ang=a+sin(z*0.35)*0.6+t*0.12;\n  float ring=fract(z*1.6);\n  float rib=fract(ang/6.2831853*(10.0+floor(S.z*10.0)));\n  float grid=smoothstep(0.42,0.08,abs(ring-0.5)*2.0)*smoothstep(0.60,0.16,abs(rib-0.5)*2.0);\n  float hue=fract(S.x+z*0.09+ang*0.05+t*0.04);\n  vec3 col=hsv(hue,0.80,1.0)*grid*(0.35+0.9*r);\n  col+=hsv(hue+0.35,0.65,1.0)*smoothstep(0.55,0.0,abs(ring-0.5)*2.0)*0.20*r;\n  col*=smoothstep(0.02,0.30,r);\n  col=col/(1.0+col*0.35);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"turing","name":"TURING","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*1.4; float t=T*(0.10+S.y*0.15);\n  vec2 body=vec2(u.x, u.y*1.6);\n  float on=smoothstep(0.95,0.80,length(body));\n  vec2 p=u+vec2(0.0, sin(u.x*3.0+t)*0.05);\n  p=vec2(p.x*(1.0+0.4*abs(p.y)), p.y);\n  float aC=fbm(p*(4.0+S.z*4.0)+vec2(t*0.05,0.0));\n  float iC=fbm(p*(9.0+S.z*7.0)+vec2(3.1,t*0.04));\n  float f=aC-iC*0.62+0.16;\n  float thr=0.155+(S.z-0.5)*0.07;\n  float stripe=smoothstep(thr-0.018,thr+0.018,f);\n  vec3 hide=mix(vec3(0.90,0.87,0.80), vec3(0.055,0.050,0.048), stripe);\n  hide*=0.80+0.30*noise(p*40.0);\n  hide*=0.55+0.55*sqrt(max(1.0-dot(body,body),0.0));\n  vec3 col=mix(vec3(0.055,0.070,0.055)*(0.6+0.5*noise(u*8.0)), hide, on);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"velvet","name":"VELVET","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*1.2; float t=T*(0.08+S.y*0.12);\n  vec2 q=u+vec2(fbm(u*1.4+t*0.06), fbm(u*1.4+vec2(4.0,1.0)-t*0.05))*0.30;\n  float fold=fbm(q*2.4)*1.4;\n  float e=0.010;\n  float fx=fbm((q+vec2(e,0.0))*2.4)*1.4-fold;\n  float fy=fbm((q+vec2(0.0,e))*2.4)*1.4-fold;\n  vec3 n=normalize(vec3(-fx,-fy,e*1.6));\n  vec3 v=normalize(vec3(u*0.3,1.0));\n  float ndv=clamp(dot(n,v),0.0,1.0);\n  float sheen=pow(1.0-ndv,3.2);\n  float lam=clamp(dot(n,normalize(vec3(0.4,0.7,0.6))),0.0,1.0);\n  vec3 base=hsv(fract(S.x+0.62),0.85,0.16);\n  vec3 col=base*(0.25+0.85*lam)+hsv(fract(S.x+0.70),0.35,1.0)*sheen*0.85;\n  col*=0.94+0.12*noise(u*160.0);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"vines","name":"VINES","author":"claude-opus-5","depth":0,"src":"vec2 vine(float s, float sd){\n  return vec2(-0.55+s*1.15+sin(s*4.0+sd*3.0)*0.10,\n              sin(s*5.0+sd*11.0)*0.28+cos(s*2.0+sd)*0.08);\n}\nvoid main(){\n  vec2 u=uvc(); float t=T*(0.10+S.y*0.16);\n  vec3 col=vec3(0.018,0.030,0.024);\n  for(int v=0;v<2;v++){\n    float fv=float(v)+S.z*5.0;\n    float grow=fract(t*0.10+float(v)*0.45);\n    float bd=1000.0, bs=0.0;\n    for(int i=0;i<22;i++){\n      float s=float(i)/21.0;\n      if(s>grow) break;\n      float d=length(u-vine(s,fv));\n      if(d<bd){ bd=d; bs=s; }\n    }\n    float w=0.010*(1.0-bs*0.6);\n    col=mix(col, hsv(0.28+S.x*0.08+float(v)*0.04,0.55,0.22+0.5*(1.0-bs)),\n            smoothstep(w,w*0.5,bd));\n    for(int i=0;i<7;i++){\n      float s=(float(i)+0.5)/7.0;\n      if(s>grow) break;\n      vec2 b=vine(s,fv);\n      vec2 n=normalize(vine(s+0.02,fv)-b+vec2(0.0002,0.0001));\n      vec2 pr=vec2(-n.y,n.x)*(mod(float(i),2.0)*2.0-1.0);\n      vec2 lc=b+pr*0.045;\n      vec2 q=vec2(dot(u-lc,pr), dot(u-lc,n));\n      float e=length(vec2(q.x/0.050,q.y/0.026))-1.0;\n      col=mix(col, hsv(0.30+S.x*0.06,0.60,0.26+0.38*hash11(s*13.0+fv)),\n              smoothstep(0.25,-0.10,e));\n    }\n  }\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"warp","name":"WARP","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u=uvc()*2.0;\n  float t=T*0.14;\n  vec2 q=vec2(fbm(u+t),fbm(u+vec2(5.2,1.3)-t));\n  vec2 r=vec2(fbm(u+4.0*q+vec2(1.7,9.2)+t*0.5),fbm(u+4.0*q+vec2(8.3,2.8)-t*0.5));\n  float v=fbm(u+4.0*r);\n  vec3 col=hsv(S.x+v*0.55+S.y*0.1,0.62,0.10+v*1.25);\n  gl_FragColor=vec4(col,1.0);\n}"},{"id":"xenoflora","name":"XENOFLORA","author":"claude-opus-5","depth":0,"src":"void main(){\n  vec2 u = uvc();\n  float t = T*(0.15 + S.y*0.20);\n  float r = length(u), a = atan(u.y, u.x);\n\n  float n = 7.0 + floor(S.z*7.0);\n  float seg = 6.2831853/n;\n  float aa = mod(a + t*0.15, seg) - seg*0.5;\n\n  float spine = abs(aa + sin(r*7.0 - t*1.2)*0.10)*r;\n  float len   = 0.31 + 0.16*noise(vec2(floor((a + t*0.15)/seg), t*0.2));\n  float grow  = smoothstep(len, len - 0.10, r)*smoothstep(0.03, 0.08, r);\n\n  float body = smoothstep(0.012, 0.0, spine)*grow;\n  float barb = smoothstep(0.006, 0.0, abs(spine - 0.020*abs(sin(r*40.0))))*grow*0.7;\n\n  vec3 lum = hsv(0.42 + S.x*0.30, 0.75, 1.0);\n  vec3 col = vec3(0.009,0.019,0.026) + body*lum*1.35 + barb*lum*0.6;\n\n  vec2 mg = floor(u*22.0);\n  float mh = hash21(mg);\n  if (mh > 0.93){\n    vec2 mf = fract(u*22.0) - 0.5;\n    col += hsv(0.55 + S.x*0.20, 0.60, 1.0)\n         * smoothstep(0.30, 0.0, length(mf))\n         * (0.40 + 0.60*sin(T*(0.8 + mh*2.0) + mh*30.0))*0.85;\n  }\n  col += lum*0.05*exp(-r*2.2);\n  gl_FragColor = vec4(col,1.0);\n}"}];

function keyOf(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
for (const s of SCREENS) s.key = keyOf(s.id);

function rnd(x,y,k){
  let h = Math.imul(x|0,2166136261) ^ Math.imul(y|0,16777619) ^ Math.imul(k,374761393);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16)) >>> 0) / 4294967296;
}

// Anything that will not compile and link is dropped before it can claim a cell.
function seal(){
  const live=[];
  for (const sc of SCREENS){
    const err = staticCheck(sc.src) || compileCheck(sc.src);
    if (err) console.warn("screen rejected: "+sc.id+" — "+err); else live.push(sc);
  }
  SCREENS.length = 0;
  for (const sc of live) SCREENS.push(sc);
}

/* ---------------- allocation ----------------
   Every cell is three screens stacked. One layer warps the sampling of another,
   then two operators fold the three together at two ratios. The full space is
   C(n,3) triples x 7 x 7 operators x 5 x 5 ratios x 3 warp depths — tens of
   millions of arrangements, walked by a coprime stride so no two cells in a
   session are ever the same. A cell is decided the first time you open it and
   cached, so the map is a function of your path. */

const FUNS  = [0.0, 0.0, 0.45, 0.85];    // most cells flat, some in the hall of mirrors

let wordAt = 0, lastIssued = null;
function takeStep(cell){
  if (cell.text !== undefined) return;
  cell.pw = wordAt;
  if (wordAt < WORDS.length){
    cell.text = WORDS[wordAt++];
    lastIssued = cell;
  } else {
    cell.text = null;                          // the message is spent; the loot begins
    if (!cell.loot) cell.loot = rollLoot(cell.gx, cell.gy);
  }
}
function giveBack(cell){                       // a peek you backed out of costs nothing
  if (cell && cell === lastIssued && cell.text){
    wordAt = cell.pw; cell.text = undefined; lastIssued = null;
  }
}

// Variable-ratio reward. Most screens hold nothing; occasionally three, and now and
// then something worth twenty-five. The schedule is the point.
const ITEMS = [{ k:"coin", v:1 }, { k:"ingot", v:5 }, { k:"gem", v:25 }];
let hoard = 0, hoardEl = null;

function rollLoot(x, y){
  const r = rnd(x, y, 21);
  const n = r < 0.55 ? 0 : r < 0.80 ? 1 : r < 0.94 ? 2 : 3;
  const out = [];
  for (let i=0;i<n;i++){
    const t = rnd(x, y, 31 + i);
    out.push({ k: t < 0.78 ? 0 : t < 0.95 ? 1 : 2, taken:false,
               px: 16 + rnd(x, y, 41 + i)*68,
               py: 20 + rnd(x, y, 51 + i)*58,
               d:  rnd(x, y, 61 + i) });
  }
  return out;
}

// The pieces are raymarched on their own canvas; these are only the tap targets.
function paintLoot(surf){
  const el = surf.loot, c = surf.cell;
  if (!el) return;
  const old = el.querySelectorAll(".hit");
  for (let i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
  if (!c || !c.loot) return;
  for (let i=0;i<c.loot.length;i++){
    const it = c.loot[i];
    if (it.taken) continue;
    const node = document.createElement("div");
    node.className = "hit";
    node.style.left = it.px + "%";
    node.style.top  = it.py + "%";
    node.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    node.addEventListener("click", function(e){ e.stopPropagation(); collect(it, node); });
    el.appendChild(node);
  }
}
function collect(it, node){
  if (it.taken) return;
  it.taken = true;
  it.burst = performance.now();
  hoard += ITEMS[it.k].v;
  if (node && node.parentNode) node.parentNode.removeChild(node);
  hoardEl.textContent = "hoard " + hoard;
  hoardEl.classList.add("on");
  hoardEl.classList.remove("pop");
  void hoardEl.offsetWidth;
  hoardEl.classList.add("pop");
  chime(ITEMS[it.k].v);
}

const resolved = new Map();
let PAIRS = [], TRIPLES = [], WALK = null;

function gcd(a,b){ while(b){ const t=a%b; a=b; b=t; } return a; }
function walker(n){
  let step = 1000003;
  while (gcd(step, n) !== 1) step += 2;
  return { n, step, at: Math.floor(Math.random()*n), used: 0 };
}
function draw(w){ const c = w.at; w.at = (w.at + w.step) % w.n; w.used++; return c; }

function initPools(){
  const n = SCREENS.length;
  PAIRS = []; TRIPLES = [];
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
    PAIRS.push([i,j]);
    for (let k=j+1;k<n;k++) TRIPLES.push([i,j,k]);
  }
  const M = MODES.length, K = MIXES.length, W = WARPS.length;
  WALK = [ walker(n),                          // one layer: just the screen
           walker(PAIRS.length*M*K*W*FUNS.length),
           walker(TRIPLES.length*M*M*K*K*W*FUNS.length) ];
}

// How many layers this cell gets. Single-layer recipes run out after n of them —
// there are only n — so once that walk is spent the arity is drawn from what is
// left. Nothing is ever reused across arities: the three spaces are disjoint.
function pickArity(){
  const r = Math.random();
  let want = r < 0.17 ? 0 : (r < 0.52 ? 1 : 2);
  for (let i=0;i<3;i++){
    const a = (want + i) % 3;
    if (WALK[a].used < WALK[a].n) return a;
  }
  return 2;
}

function nextCombo(){
  const arity = pickArity();
  const M = MODES.length, K = MIXES.length, W = WARPS.length;
  let c = draw(WALK[arity]);

  if (arity === 0){
    return { n:1, a:SCREENS[c], b:null, c:null, m1:0, m2:0, k1:0.5, k2:0.5, warp:0 };
  }
  const wi = c % W; c = (c - wi)/W;
  const fi = c % FUNS.length; c = (c - fi)/FUNS.length;
  if (arity === 1){
    const k1 = c % K; c = (c - k1)/K;
    const m1 = c % M; c = (c - m1)/M;
    const pr = PAIRS[c % PAIRS.length];
    return { n:2, a:SCREENS[pr[0]], b:SCREENS[pr[1]], c:null,
             m1, m2:0, k1:MIXES[k1], k2:0.5, warp:WARPS[wi], fun:FUNS[fi] };
  }
  const k2 = c % K; c = (c - k2)/K;
  const k1 = c % K; c = (c - k1)/K;
  const m2 = c % M; c = (c - m2)/M;
  const m1 = c % M; c = (c - m1)/M;
  const tr = TRIPLES[c % TRIPLES.length];
  return { n:3, a:SCREENS[tr[0]], b:SCREENS[tr[1]], c:SCREENS[tr[2]],
           m1, m2, k1:MIXES[k1], k2:MIXES[k2], warp:WARPS[wi], fun:FUNS[fi] };
}

function resolve(x,y){
  const key = x+","+y;
  const hit = resolved.get(key);
  if (hit) return hit;
  const cell = nextCombo();
  cell.seedA = [rnd(x,y,2), rnd(x,y,3), rnd(x,y,4)];
  cell.seedB = [rnd(x,y,5), rnd(x,y,6), rnd(x,y,7)];
  cell.seedC = [rnd(x,y,11), rnd(x,y,12), rnd(x,y,13)];
  cell.gx = x; cell.gy = y;
  resolved.set(key, cell);
  return cell;
}

/* ================= gl surfaces ================= */
const VS = "attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }";
const DPR = Math.min(window.devicePixelRatio || 1, 1.75);
const FBSCALE = 0.62;
const GLOPTS = {antialias:false, alpha:false, depth:false, stencil:false, powerPreference:"low-power"};

// Each layer renders to its own texture; this folds the three together. No source
// rewriting, so helper names in different screens can never collide.
const COMPOSE = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D A;
uniform sampler2D B;
uniform sampler2D C;
uniform vec2 R;
uniform float T, M1, M2, K1, K2, W, N, F;
float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float nz(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),u.x),
             mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),u.x),u.y);
}
vec3 opx(vec3 a, vec3 b, float m, float k, vec2 q, float t){
  if (m < 0.5) return mix(a, b, k);
  if (m < 1.5) return 1.0 - (1.0-a)*(1.0 - b*(0.6+k));
  if (m < 2.5) return mix(a, a*(0.30 + b*1.8), 0.45 + k*0.55);

vec2 funhouse(vec2 q, float amt, float t){
  float r2 = dot(q,q);
  vec2 p = q*(1.0 + 0.55*sin(t*0.37)*r2*amt);      // barrel breathing in and out
  p.x += sin(q.y*9.0 + t*0.90)*0.055*amt;          // rippled panel
  p.y += sin(q.x*7.0 - t*0.70)*0.035*amt;

  if (N < 2.5){                       // two layers: B warps A, one operator
    vec3 bb = texture2D(B, uvf).rgb;

function makeSurface(pane){
  const canvas = pane.querySelector("canvas");
  const gl = canvas.getContext("webgl", GLOPTS) || canvas.getContext("experimental-webgl", GLOPTS);
  if (!gl) return null;
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VS); gl.compileShader(vs);

           cell:null, w:0, h:0, fw:0, fh:0, tgt:null, comp:null };
}
function programFor(surf, screen){
  const hit = surf.progs[screen.key];
  if (hit !== undefined) return hit;
  const gl = surf.gl;
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, PRE + screen.src); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) { surf.progs[screen.key] = null; return null; }

  gl.attachShader(p, surf.vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { surf.progs[screen.key] = null; return null; }

  surf.progs[screen.key] = rec;

}
function makeTarget(gl,w,h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

}

  if (!surf.comp){
    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, COMPOSE); gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)){
      console.warn("compositor: "+gl.getShaderInfoLog(fs)); surf.comp = false; return false;
    }
    const p = gl.createProgram();
    gl.attachShader(p, surf.vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)){ surf.comp = false; return false; }
    surf.comp = { p, loc:gl.getAttribLocation(p,"p"),
      R:gl.getUniformLocation(p,"R"), T:gl.getUniformLocation(p,"T"),
      M1:gl.getUniformLocation(p,"M1"), M2:gl.getUniformLocation(p,"M2"),
      K1:gl.getUniformLocation(p,"K1"), K2:gl.getUniformLocation(p,"K2"),
      W:gl.getUniformLocation(p,"W"), N:gl.getUniformLocation(p,"N"),
      F:gl.getUniformLocation(p,"F"),
      uA:gl.getUniformLocation(p,"A"), uB:gl.getUniformLocation(p,"B"), uC:gl.getUniformLocation(p,"C") };

  if (surf.comp === false) return false;

    if (surf.tgt) for (const t of surf.tgt){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
    surf.fw = fw; surf.fh = fh;
    surf.tgt = [makeTarget(gl,fw,fh), makeTarget(gl,fw,fh), makeTarget(gl,fw,fh)];

}
function sizeSurface(surf){
  const w = Math.max(1, Math.round(window.innerWidth*DPR)), h = Math.max(1, Math.round(window.innerHeight*DPR));

function drawScreen(surf, screen, seed, t, w, h){
  const rec = programFor(surf, screen);
  if (!rec) return false;
  const gl = surf.gl;
  gl.useProgram(rec.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, surf.buf);
  gl.enableVertexAttribArray(rec.loc);
  gl.vertexAttribPointer(rec.loc, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(rec.R, w, h);
  gl.uniform1f(rec.T, t);
  gl.uniform3f(rec.S, seed[0], seed[1], seed[2]);

function drawSurface(surf, t){
  const c = surf.cell;

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, surf.w, surf.h);

  }
  if (!ensureTargets(surf)){
    gl.viewport(0,0,surf.w,surf.h);

    return;
  }
  gl.viewport(0, 0, surf.fw, surf.fh);
  const layers = [[c.a,c.seedA],[c.b,c.seedB],[c.c,c.seedC]];
  for (let i=0;i<c.n;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, surf.tgt[i].fb);
    drawScreen(surf, layers[i][0], layers[i][1], t, surf.fw, surf.fh);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, surf.w, surf.h);
  const k = surf.comp;
  gl.useProgram(k.p);
  gl.bindBuffer(gl.ARRAY_BUFFER, surf.buf);
  gl.enableVertexAttribArray(k.loc);
  gl.vertexAttribPointer(k.loc, 2, gl.FLOAT, false, 0, 0);
  const units = [k.uA, k.uB, k.uC];
  for (let i=0;i<3;i++){
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, surf.tgt[Math.min(i, c.n-1)].tex);   // never sample an unwritten target
    gl.uniform1i(units[i], i);
  }
  gl.uniform2f(k.R, surf.w, surf.h);
  gl.uniform1f(k.T, t);
  gl.uniform1f(k.M1, c.m1); gl.uniform1f(k.M2, c.m2);
  gl.uniform1f(k.K1, c.k1); gl.uniform1f(k.K2, c.k2);
  gl.uniform1f(k.W, c.warp);
  gl.uniform1f(k.N, c.n);
  gl.uniform1f(k.F, c.fun || 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ================= compile gate =================
   Nothing joins SCREENS until it has compiled and linked for real, in a
   throwaway context. A broken submission can never take down the grid. */
const scratchGL = document.getElementById("scratch").getContext("webgl", GLOPTS);
function compileCheck(src){
  if (!scratchGL) return null;
  const gl = scratchGL;
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, PRE + src); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(fs) || "compile failed";
    gl.deleteShader(fs);
    return log.trim().split("\n").slice(0,6).join("\n");
  }
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VS); gl.compileShader(vs);
  const p = gl.createProgram();
  gl.attachShader(p,vs); gl.attachShader(p,fs); gl.linkProgram(p);
  const ok = gl.getProgramParameter(p, gl.LINK_STATUS);
  const log = ok ? null : (gl.getProgramInfoLog(p) || "link failed").trim();
  gl.deleteProgram(p); gl.deleteShader(fs); gl.deleteShader(vs);
  return log;
}
const RESERVED = ["hash11","hash21","hash22","noise","fbm","hsv","rot","uvc"];
function staticCheck(src){
  if (!/void\s+main\s*\(\s*\)/.test(src)) return "no void main()";
  if (!/gl_FragColor/.test(src)) return "never writes gl_FragColor";
  if (/^\s*#(version|extension)/m.test(src)) return "preprocessor directive not allowed";
  if (/^\s*(uniform|attribute|varying)\s/m.test(src)) return "declares its own uniform/attribute/varying";
  if (/precision\s+(low|medium|high)p/.test(src)) return "declares a precision statement";
  for (const n of RESERVED)
    if (new RegExp("(float|vec2|vec3|vec4|mat2|mat3|void)\\s+"+n+"\\s*\\(").test(src))
      return 'redefines prelude symbol "'+n+'"';
  return null;
}

const stage=document.getElementById("stage"), world=document.getElementById("world");
const nameEl=document.getElementById("name"), coordEl=document.getElementById("coord"), hintEl=document.getElementById("hint");
let A=makeSurface(document.getElementById("pa")), B=makeSurface(document.getElementById("pb"));
if (A){ A.word = document.getElementById("wa"); A.loot = document.getElementById("la"); }
if (B){ B.word = document.getElementById("wb"); B.loot = document.getElementById("lb"); }

let cx=0, cy=0, cur=A, nxt=B, offX=0, offY=0, dirX=0, dirY=0;
let dragging=false, axis=null, startX=0, startY=0, lastX=0, lastY=0, lastT=0, vel=0, anim=null, swiped=false;

// pane and its overlays move together
function setHud(cell,x,y){
  const names = [cell.a, cell.b, cell.c].slice(0, cell.n).map(function(sc){ return sc.name; });
  nameEl.textContent = names.join(" \u00d7 ");
  const ops = cell.n === 1 ? "single"
            : cell.n === 2 ? MODES[cell.m1]

    + (cell.warp > 0 ? " \u00b7 warped" : "") + (cell.fun > 0 ? " \u00b7 funhouse" : "");

function applyWorld(){ world.style.transform="translate3d("+offX+"px,"+offY+"px,0)"; }
function loadCell(surf,x,y){ const c=resolve(x,y); surf.cell=c; return c; }
function paintWord(surf){
  const c = surf.cell, el = surf.word;
  const w = c ? c.text : null;
  if (!w){ el.style.opacity = 0; el.innerHTML = ""; return; }
  el.innerHTML = "<div></div>";
  const m = el.firstChild;

function placePane(surf, tf){ surf.el.style.transform = tf; surf.word.style.transform = tf; surf.loot.style.transform = tf; }
function showPane(surf, on){

  surf.word.classList.toggle("hidden", !on);

}
function placeNext(){ placePane(nxt, "translate3d("+(dirX*window.innerWidth)+"px,"+(dirY*window.innerHeight)+"px,0)"); }
function prepareNeighbor(dx,dy){
  if (dirX===dx && dirY===dy && !nxt.el.classList.contains("hidden")) return;
  giveBack(nxt.cell);
  dirX=dx; dirY=dy;
  loadCell(nxt,cx+dx,cy+dy);
  takeStep(nxt.cell); paintWord(nxt); paintLoot(nxt);
  placeNext(); showPane(nxt, true);
}
function hideNeighbor(){ giveBack(nxt.cell); paintWord(nxt); paintLoot(nxt); showPane(nxt, false); dirX=0; dirY=0; }
function commit(){
  cx+=dirX; cy+=dirY;

function animateTo(tx,ty,done){
  const fx=offX, fy=offY, d=Math.hypot(tx-fx,ty-fy);

}
function stepAnim(now){
  if (!anim) return;
  let k=(now-anim.t0)/anim.dur; if (k>=1) k=1;
  const e=1-Math.pow(1-k,3);
  offX=anim.fx+(anim.tx-anim.fx)*e; offY=anim.fy+(anim.ty-anim.fy)*e;

  if (anim) return;
  dragging=true; axis=null; stage.classList.add("dragging");
  startX=lastX=e.clientX; startY=lastY=e.clientY; lastT=performance.now(); vel=0;
  stage.setPointerCapture(e.pointerId);

stage.addEventListener("pointermove", e=>{
  if (!dragging) return;
  const W=window.innerWidth, H=window.innerHeight;
  let dx=e.clientX-startX, dy=e.clientY-startY;
  if (!axis){ if (Math.hypot(dx,dy)<10) return; axis=Math.abs(dx)>Math.abs(dy)?"x":"y"; }
  const now=performance.now(), dt=Math.max(1,now-lastT);
  vel = axis==="x" ? (e.clientX-lastX)/dt : (e.clientY-lastY)/dt;
  lastX=e.clientX; lastY=e.clientY; lastT=now;
  if (axis==="x"){
    if (dx===0){ hideNeighbor(); offX=0; offY=0; applyWorld(); return; }
    prepareNeighbor(dx<0?1:-1,0); offX=Math.max(-W,Math.min(W,dx)); offY=0;
  } else {
    if (dy===0){ hideNeighbor(); offX=0; offY=0; applyWorld(); return; }
    prepareNeighbor(0,dy<0?1:-1); offY=Math.max(-H,Math.min(H,dy)); offX=0;

});
function release(){
  if (!dragging) return;
  dragging=false; axis=null; stage.classList.remove("dragging");
  if (!dirX && !dirY) return;
  const span = dirX!==0 ? window.innerWidth : window.innerHeight;
  const travelled = Math.abs(dirX!==0 ? offX : offY);
  if (travelled > span*0.26 || Math.abs(vel) > 0.45){
    if (!swiped){ swiped=true; hintEl.classList.add("gone"); }
    animateTo(-dirX*window.innerWidth, -dirY*window.innerHeight, commit);

stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);

});
window.addEventListener("resize", ()=>{ sizeSurface(A); sizeSurface(B); if (dirX||dirY) placeNext(); applyWorld(); });

/* ================= treasure =================
   Each piece is a small raymarched solid with its own signed-distance field, lit by
   a procedural studio environment and shaded as metal: reflection, fresnel, a hard
   specular and a screen-space four-point glint. Picking one up hands it to a burst —
   radial shards on an expanding shock ring plus ten sparks thrown outward under

const LOOT_FS = `

precision highp float;
#else

#endif

float sdCyl(vec3 p, float r, float h){

}

float coin(vec3 p){

  h+=0.022*smoothstep(0.13,0.0,abs(cos(a*6.0)*0.55-r));

  c+=vec3(1.0,0.96,0.88)*pow(max(dot(d,normalize(vec3(0.40,0.80,0.45))),0.0),26.0)*2.4;

        c+=pow(max(dot(n,normalize(vec3(0.45,0.75,0.55))),0.0),44.0)*vec3(1.0,0.97,0.88)*2.2;
      } else {
        c =env(normalize(refract(rd,n,0.62)+rf*0.35))*vec3(0.55,0.95,1.00)*0.60;
        c+=vec3(env(normalize(rf+vec3(0.03,0.0,0.0))).r, env(rf).g,
                env(normalize(rf-vec3(0.03,0.0,0.0))).b)*tint*(0.35+0.90*fres);
        c+=pow(max(dot(n,normalize(vec3(0.45,0.75,0.55))),0.0),60.0)*3.0;
      }
      vec2 gp=dq-vec2(0.34,0.34);
      float star=max(0.0,1.0-abs(gp.x)*17.0)*max(0.0,1.0-abs(gp.y)*2.0)
                +max(0.0,1.0-abs(gp.y)*17.0)*max(0.0,1.0-abs(gp.x)*2.0);
      c+=tint*star*(0.55+0.45*sin(T*2.4+seed*9.0))*0.85;
      col+=c; alpha=1.0;
    } else {
      float k=age/0.75;
      if (k>1.0) continue;
      vec3 tint = kind<1.5 ? vec3(1.00,0.78,0.34) : vec3(0.65,0.90,1.00);
      float rl=length(dq), aa=atan(dq.y,dq.x);
      col+=tint*smoothstep(0.30,0.0,abs(fract(aa*14.0/6.2831853+seed)-0.5)*2.0)
              *smoothstep(0.60,0.0,abs(rl-k*3.4))*exp(-k*3.0)*2.4;
      col+=tint*exp(-rl*3.4)*exp(-k*6.5)*3.0;
      for (int sp=0;sp<10;sp++){
        float fs=float(sp), an=fs*0.6283+seed*6.28;
        vec2 pq=vec2(cos(an),sin(an))*(1.7+h11(fs+seed*11.0)*2.6)*age*2.6
               -vec2(0.0,10.0*age*age);
        col+=tint*exp(-length(dq-pq)*22.0)*exp(-k*3.2)*1.8;
      }
      alpha=max(alpha, clamp(max(max(col.r,col.g),col.b),0.0,1.0));
    }
  }
  if (alpha<=0.003) discard;
  gl_FragColor=vec4(col, clamp(alpha,0.0,1.0));
}`;

function makeLoot(canvas){
  const gl = canvas.getContext("webgl", {antialias:false, alpha:true, depth:false, premultipliedAlpha:false});
  if (!gl) return null;
  const buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const vs=gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs,VS); gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs,LOOT_FS); gl.compileShader(fs);
  if(!gl.getShaderParameter(fs,gl.COMPILE_STATUS)){ console.warn("loot: "+gl.getShaderInfoLog(fs)); return null; }
  const pr=gl.createProgram();
  gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return null;
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  return { canvas, gl, buf, pr, loc:gl.getAttribLocation(pr,"p"),
           R:gl.getUniformLocation(pr,"R"), T:gl.getUniformLocation(pr,"T"),
           LI:gl.getUniformLocation(pr,"LI[0]"), LB:gl.getUniformLocation(pr,"LB[0]"),
           w:0, h:0, li:new Float32Array(12), lb:new Float32Array(6) };
}

function drawLoot(surf, t, now){
  const L=surf.lgl, c=surf.cell;
  if (!L) return;
  const w=Math.max(1,Math.round(window.innerWidth*DPR*0.85));
  const h=Math.max(1,Math.round(window.innerHeight*DPR*0.85));
  if (L.w!==w||L.h!==h){ L.w=w; L.h=h; L.canvas.width=w; L.canvas.height=h; }
  const gl=L.gl;
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if (!c || !c.loot || !c.loot.length) return;
  let any=false;
  for (let i=0;i<3;i++){
    const it=c.loot[i];
    let alive=0, age=-1;
    if (it){
      if (!it.taken) alive=1;
      else if (it.burst){ age=(now-it.burst)/1000; if (age>0.78) age=-1; }
      L.li[i*4]=it.px/100; L.li[i*4+1]=it.py/100; L.li[i*4+2]=it.k; L.li[i*4+3]=it.d;
    } else { L.li[i*4]=0; L.li[i*4+1]=0; L.li[i*4+2]=0; L.li[i*4+3]=0; }
    L.lb[i*2]=alive; L.lb[i*2+1]=age;
    if (alive || age>=0) any=true;
  }
  if (!any) return;
  gl.useProgram(L.pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,L.buf);
  gl.enableVertexAttribArray(L.loc);
  gl.vertexAttribPointer(L.loc,2,gl.FLOAT,false,0,0);
  gl.uniform2f(L.R,w,h); gl.uniform1f(L.T,t);
  gl.uniform4fv(L.LI,L.li); gl.uniform2fv(L.LB,L.lb);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ================= sound =================
   The same shape as the picture. Every screen carries a voice derived from its
   own id hash: a degree of the scale, a register, a waveform, a role. A cell
   sounds the three voices of its three layers, balanced by the very same pair of
   ratios the compositor uses — so what you hear is the mix you are looking at.
   The scale is just-intoned and deliberately unhappy: minor second, minor third,
   tritone, minor sixth. Nothing in it resolves. */

const SCALE = [1, 16/15, 6/5, 5/4, 45/32, 3/2, 8/5, 9/5];
const ROOT  = 55.0;
let AC = null, master = null, live = [], soundOn = false, pinger = null;
let userMuted = false;   // an explicit mute survives every later swipe
const sndBtn = document.getElementById("snd");

function audioInit(){
  if (AC) return true;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return false;
  AC = new Ctor();
  master = AC.createGain(); master.gain.value = 0;
  const lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3800;
  const dl = AC.createDelay(2.0); dl.delayTime.value = 0.42;
  const fb = AC.createGain(); fb.gain.value = 0.44;
  const wet = AC.createGain(); wet.gain.value = 0.32;
  master.connect(lp); lp.connect(AC.destination);
  lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(AC.destination);
  return true;
}

function makeVoice(screen, slot, amp, vib){
  const h = screen.key;
  const deg  = h % SCALE.length;
  const oct  = (h >>> 5) % 3;
  const role = (h >>> 9) % 3;                 // 0 drone, 1 pulse, 2 shimmer
  const wave = ["sine","triangle","sawtooth","square"][(h >>> 13) % 4];
  const freq = ROOT*SCALE[deg]*Math.pow(2, oct + slot + (role === 2 ? 1 : 0));
  const now  = AC.currentTime;

  const g = AC.createGain(); g.gain.value = 0;
  const filt = AC.createBiquadFilter();
  filt.type = "lowpass";
  filt.frequency.value = 240 + (h % 1900);
  filt.Q.value = role === 1 ? 7 : 1.2;
  filt.connect(g); g.connect(master);

  const nodes = [];
  const vg = AC.createGain(); vg.gain.value = vib*110;   // the warp depth becomes vibrato
  const vo = AC.createOscillator(); vo.frequency.value = 3.8 + (h % 9)*0.35;
  vo.connect(vg); vo.start(); nodes.push(vo);

  for (let i=0;i<3;i++){
    const o = AC.createOscillator();
    o.type = wave;
    o.frequency.value = freq;
    o.detune.value = (i-1)*(4 + ((h >>> 3) % 10));
    if (vib > 0) vg.connect(o.detune);
    o.connect(filt); o.start(); nodes.push(o);
  }
  const drift = AC.createOscillator();
  drift.frequency.value = 0.025 + (h % 40)/450;
  const dg = AC.createGain(); dg.gain.value = filt.frequency.value*0.45;
  drift.connect(dg); dg.connect(filt.frequency); drift.start(); nodes.push(drift);

  if (role === 0){
    g.gain.linearRampToValueAtTime(amp, now + 2.2);
  } else {
    const base = role === 1 ? amp*0.45 : amp*0.40;
    g.gain.linearRampToValueAtTime(base, now + 1.6);
    const trem = AC.createOscillator();
    trem.frequency.value = role === 1 ? 0.7 + (h % 17)*0.16 : 0.11 + (h % 11)*0.03;
    const tg = AC.createGain(); tg.gain.value = base;
    trem.connect(tg); tg.connect(g.gain); trem.start(); nodes.push(trem);
  }
  return { g, nodes, deg, oct };
}

function killVoices(){
  const now = AC.currentTime;
  for (const v of live){
    v.g.gain.cancelScheduledValues(now);
    v.g.gain.setValueAtTime(v.g.gain.value, now);
    v.g.gain.linearRampToValueAtTime(0, now + 0.9);
    for (const n of v.nodes){ try { n.stop(now + 1.0); } catch(e){} }
  }
  live = [];
}

function audioSetCell(cell){
  if (!AC || !cell) return;
  killVoices();
  let w;
  if (cell.n === 1)      w = [1, 0, 0];
  else if (cell.n === 2) w = [1 - cell.k1, cell.k1, 0];
  else                   w = [(1-cell.k2)*(1-cell.k1), (1-cell.k2)*cell.k1, cell.k2];
  const layers = [cell.a, cell.b, cell.c];
  const solo = cell.n === 1 ? 0.42 : 0.55;
  for (let i=0;i<cell.n;i++) live.push(makeVoice(layers[i], i, 0.10 + w[i]*solo, cell.warp));
}

function chime(v){                              // the reward sound
  if (!AC || !soundOn) return;
  const now = AC.currentTime;
  const base = v >= 25 ? 5 : v >= 5 ? 3 : 0;
  for (let i=0;i<3;i++){
    const o = AC.createOscillator();
    o.type = "triangle";
    o.frequency.value = ROOT*SCALE[(base + i*2) % SCALE.length]*Math.pow(2, 5);
    const g = AC.createGain(); g.gain.value = 0;
    o.connect(g); g.connect(master);
    const at = now + i*0.055;
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(0.10, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0006, at + 1.1);
    o.start(at); o.stop(at + 1.2);
  }
}

function ping(){                     // sparse plucks from degrees already sounding
  if (!AC || !soundOn || !live.length) return;
  if (Math.random() > 0.34) return;
  const v = live[(Math.random()*live.length)|0];
  const now = AC.currentTime;
  const o = AC.createOscillator();
  o.type = "sine";
  o.frequency.value = ROOT*SCALE[v.deg]*Math.pow(2, v.oct + 3);
  const g = AC.createGain(); g.gain.value = 0;
  o.connect(g); g.connect(master);
  g.gain.linearRampToValueAtTime(0.055, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0006, now + 2.4);
  o.start(now); o.stop(now + 2.5);
}

function soundStart(force){
  if (soundOn) return;
  if (userMuted && !force) return;             // the swipe must not undo the button
  if (!audioInit()) return;
  if (AC.state === "suspended") AC.resume();
  soundOn = true;
  master.gain.linearRampToValueAtTime(0.065, AC.currentTime + 1.4);
  sndBtn.textContent = "sound on";
  sndBtn.style.opacity = .95;
  audioSetCell(cur.cell);
  if (!pinger) pinger = setInterval(ping, 620);
}
function soundStop(){
  userMuted = true;
  if (!AC || !soundOn) return;
  soundOn = false;
  master.gain.cancelScheduledValues(AC.currentTime);
  master.gain.linearRampToValueAtTime(0, AC.currentTime + 0.6);
  sndBtn.textContent = "sound off";
  sndBtn.style.opacity = .6;
}
sndBtn.addEventListener("click", e => {
  e.stopPropagation();
  if (soundOn) soundStop(); else { userMuted = false; soundStart(true); }
});

/* ================= boot ================= */
seal();
initPools();
A.lgl = makeLoot(document.getElementById("ga"));   // after LOOT_FS is initialised
B.lgl = makeLoot(document.getElementById("gb"));
sizeSurface(A); sizeSurface(B);
const first=loadCell(cur,cx,cy);
takeStep(first); paintWord(cur); paintLoot(cur);
placePane(cur, "translate3d(0,0,0)");
showPane(cur, true); showPane(nxt, false);
setHud(first,cx,cy);
const t0=performance.now();
(function frame(now){
  stepAnim(now);
  const t=(now-t0)/1000;
  drawSurface(cur,t);
  drawLoot(cur,t,now);
  if (!nxt.el.classList.contains("hidden")) drawLoot(nxt,t,now);
  if (!nxt.el.classList.contains("hidden")) drawSurface(nxt,t);
  requestAnimationFrame(frame);
})(performance.now());
</script>
